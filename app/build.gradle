plugins { id 'com.android.application' }

android {
    namespace 'com.aether3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aether3d'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20' } }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }

    externalNativeBuild {
        cmake { path file('../CMakeLists.txt'); version '3.22.1' }
    }
}
