plugins {
    id 'com.android.application'
}

android {
    namespace 'com.odettegd.aether3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.odettegd.aether3d'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O2 -ffunction-sections -fdata-sections'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }
}
