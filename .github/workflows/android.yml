name: Aether 3D Android

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Fetch and bake Kenney Nature world
        run: |
          python3 tools/generate_kenney_world.py --output app/src/main/cpp/generated/kenney_world.h
          test -s app/src/main/cpp/generated/kenney_world.h
          wc -c app/src/main/cpp/generated/kenney_world.h

      - name: Compile Vulkan shaders
        run: |
          mkdir -p app/src/main/shaders
          glslangValidator -V --target-env vulkan1.1 app/src/main/shaders/aether.vert -o app/src/main/shaders/aether.vert.spv
          glslangValidator -V --target-env vulkan1.1 app/src/main/shaders/aether.frag -o app/src/main/shaders/aether.frag.spv
          glslangValidator -V --target-env vulkan1.1 app/src/main/shaders/aether.comp -o app/src/main/shaders/aether.comp.spv
          python3 tools/generate_spirv_header.py
          test -f app/src/main/cpp/generated/shaders_spv.h && wc -c app/src/main/cpp/generated/shaders_spv.h
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libaether3d.so"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether3d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
